name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
            archive: jlx-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-windows
            archive: jlx-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-macos
            archive: jlx-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-macos
            archive: jlx-macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.15.0'

      - name: Build (retry on transient fetch failures)
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt/$maxAttempts for target ${{ matrix.target }}"
            zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --summary all
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "zig build failed (attempt $attempt). Retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

          throw "zig build failed after $maxAttempts attempts"

      - name: Package (Unix — tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive }} -C zig-out/bin jlx

      - name: Package (Windows — zip)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path zig-out\bin\jlx.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
